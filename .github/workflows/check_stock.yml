name: Verificare Stoc Tuburi Rollo

on:
  schedule:
    - cron: '0 7,11,15,19 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Simulează că produsul este în stoc (trimite notificare de test)'
        required: false
        default: false
        type: boolean

jobs:
  check-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Descarcă codul din repository
        uses: actions/checkout@v4

      - name: Configurează Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalează dependințele
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rulează scriptul de verificare
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_AVAILABLE: ${{ github.event.inputs.test_notification }}
        run: python check_stock.py